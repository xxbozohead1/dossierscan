<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400..700&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#090d12;color:#e7ecf3;font-family:"Instrument Sans",system-ui,sans-serif;position:relative}
.frame{position:absolute;inset:0;padding:72px 84px;box-sizing:border-box;display:flex;flex-direction:column;
  background:radial-gradient(900px 500px at 100% 0%,rgba(143,163,255,.16),transparent 60%),#090d12}
.brand{display:flex;align-items:center;gap:16px;font:700 38px "Bricolage Grotesque",sans-serif;letter-spacing:-.01em}
.brand svg{width:46px;height:46px;color:#8fa3ff}
.eyebrow{margin-top:44px;font:500 22px "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#8792a4}
h1{margin:18px 0 0;font:800 86px/1.02 "Bricolage Grotesque",sans-serif;letter-spacing:-.025em;max-width:980px}
.chips{margin-top:auto;display:flex;gap:16px}
.chip{display:inline-flex;align-items:center;gap:12px;padding:12px 22px;border-radius:999px;font:600 26px "Instrument Sans",sans-serif}
.chip i{width:13px;height:13px;border-radius:50%;background:currentColor}
.ok{color:#39d08c;background:#0e2a1d}.bad{color:#ff6072;background:#301318}.warn{color:#f3b64b;background:#2c2210}
.lede{margin-top:22px;font:500 32px "Instrument Sans",sans-serif;color:#b4bfcd}
</style></head>
<body><div class="frame">
<div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5a1.5 1.5 0 0 1 1.5-1.5h5l2 2h8a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 12.5l2.3 2.3 4.7-4.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>Dossier</div>
<div class="eyebrow">Orbio launchpad · Robinhood Chain</div>
<h1>Know which launch is the real one.</h1>
<div class="lede">A file on every Orbio agent, with receipts.</div>
<div class="chips"><span class="chip ok"><i></i>Verified</span><span class="chip bad"><i></i>Impersonator</span><span class="chip warn"><i></i>Checking</span></div>
</div></body></html>
