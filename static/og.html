<!doctype html>
<!-- The link-preview card. Regenerate static/og.png: msedge --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=8000 --screenshot=og.png og.html -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=IBM+Plex+Mono:wght@400;500;600;700&family=Instrument+Sans:wght@400..700&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#090d12;color:#e7ecf3;font-family:"Instrument Sans",system-ui,sans-serif}
.frame{position:absolute;inset:0;padding:70px 0 70px 84px;box-sizing:border-box;display:flex;flex-direction:column;
  background:radial-gradient(700px 520px at 82% 50%,rgba(57,208,140,.13),transparent 62%),
             radial-gradient(900px 500px at 0% 0%,rgba(143,163,255,.10),transparent 60%),#090d12}
.brand{display:flex;align-items:center;gap:14px;font:700 38px "Bricolage Grotesque",sans-serif;letter-spacing:-.01em}
.brand svg{width:48px;height:48px;color:#39d08c}
.eyebrow{margin-top:40px;font:500 21px "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#8792a4}
h1{margin:16px 0 0;font:800 74px/1.03 "Bricolage Grotesque",sans-serif;letter-spacing:-.025em;max-width:640px}
.lede{margin-top:20px;font:500 29px "Instrument Sans",sans-serif;color:#b4bfcd;max-width:640px}
.chips{margin-top:auto;display:flex;gap:14px}
.chip{display:inline-flex;align-items:center;gap:11px;padding:11px 20px;border-radius:999px;font:600 24px "Instrument Sans",sans-serif}
.chip i{width:12px;height:12px;border-radius:50%;background:currentColor}
.ok{color:#39d08c;background:#0e2a1d}.bad{color:#ff6072;background:#301318}.warn{color:#f3b64b;background:#2c2210}
.seal{position:absolute;right:46px;top:95px;width:440px;height:440px;filter:drop-shadow(0 0 28px rgba(57,208,140,.25))}
</style></head>
<body><div class="frame">
<div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><g transform="rotate(-14 12 12)" fill="none" stroke="currentColor">
<circle cx="12" cy="12" r="10.3" stroke-width="1.8"/><circle cx="12" cy="12" r="8.1" stroke-width="1.5" stroke-dasharray="1.5 1.3" opacity=".7"/>
<circle cx="12" cy="12" r="5.9" stroke-width="1"/><path d="M9.5 12.1l1.8 1.8 3.4-3.7" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g></svg>Dossier</div>
<div class="eyebrow">Orbio launchpad · Robinhood Chain</div>
<h1>Know which launch is the real one.</h1>
<div class="lede">A file on every Orbio agent, with receipts.</div>
<div class="chips"><span class="chip ok"><i></i>Verified</span><span class="chip bad"><i></i>Impersonator</span><span class="chip warn"><i></i>Checking</span></div>
</div>
<svg class="seal" viewBox="0 0 512 512" aria-hidden="true"><defs>
<filter id="rough" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4"/></filter>
<path id="ring" d="M256,256 m-151,0 a151,151 0 1,1 302,0 a151,151 0 1,1 -302,0"/></defs>
<g transform="rotate(-14 256 256)" filter="url(#rough)">
<circle cx="256" cy="256" r="197" fill="none" stroke="#39d08c" stroke-width="14"/>
<circle cx="256" cy="256" r="120" fill="none" stroke="#39d08c" stroke-width="7"/>
<text font-family="IBM Plex Mono" font-weight="700" font-size="31" fill="#39d08c" textLength="945" lengthAdjust="spacing"><textPath href="#ring">DOSSIER • VERIFIED • DOSSIER • VERIFIED •</textPath></text>
<path d="M203 258 l38 38 l74 -80" fill="none" stroke="#39d08c" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
</g></svg>
</body></html>
